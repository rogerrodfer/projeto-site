<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
</head>

<h1>Cadastro</h1>
<p>
    Seja um membro da nossa comunidade.
</p>

<body>

    <fieldset>
        <h3>Preencha o cadastro e entraremos em contato:</h3>

        <form action="">
            <table>
                <tr>
                    <td>
                        <label for="ipt-nome">Nome:</label>
                    </td>
                    <td>
                        <input type="text" id="ipt-nome" name="nome" placeholder="Seu nome">
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="ipt-email">E-mail:</label>
                    </td>
                    <td>
                        <input type="text" id="ipt-email" name="email" placeholder="exemplo123@exemplo.com">
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="ipt-fone">Whatsapp:</label>
                    </td>
                    <td>
                        <input type="text" id="ipt-fone" name="fone" placeholder=" Ex: 85 99999-9999">
                    </td>
                </tr>
            </table><br>

            <label for="mensagem">Mensagem:</label> <br>
            <textarea id="mensagem" name="message" rows="5" placeholder="Digite sua mensagem..."></textarea><br>

            <td><button type="submit">Enviar</button></td>

        </form>

    </fieldset><br>

    <div style="text-align: center;" >
        <a href="../index.html">Voltar</a>
    </div>

</body>

</html>
